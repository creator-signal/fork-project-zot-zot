name: Publish Creator Signal Zot image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable Creator Signal Zot release tag (for example, cs-2.1.21.1)
        required: true
        type: string
      zui_release_tag:
        description: Immutable Creator Signal ZUI GitHub release containing zui.tgz
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, scan, attest, and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the Creator Signal reconciliation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: creator-signal/main
          persist-credentials: false

      - name: Validate immutable release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ZUI_RELEASE_TAG: ${{ inputs.zui_release_tag }}
        run: |
          set -eu
          printf '%s' "$RELEASE_TAG" | grep -Eq '^cs-[0-9A-Za-z][0-9A-Za-z._-]*$'
          printf '%s' "$ZUI_RELEASE_TAG" | grep -Eq '^cs-[0-9A-Za-z][0-9A-Za-z._-]*$'
          curl --fail --silent --show-error --location \
            "https://github.com/creator-signal/fork-project-zot-zui/releases/download/${ZUI_RELEASE_TAG}/zui.tgz" \
            --output /tmp/zui.tgz
          test -s /tmp/zui.tgz

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-architecture image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/creator-signal/zot:${{ inputs.release_tag }}
          build-args: |
            COMMIT=${{ github.sha }}
            ZUI_REPO_OWNER=creator-signal
            ZUI_REPO_NAME=fork-project-zot-zui
            ZUI_VERSION=${{ inputs.zui_release_tag }}

      - name: Record the published image identity
        run: |
          printf '%s\n' "ghcr.io/creator-signal/zot:${{ inputs.release_tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
